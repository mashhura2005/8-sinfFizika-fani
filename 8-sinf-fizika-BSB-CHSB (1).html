.tools{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}

.tools button[aria-pressed=true]{background:#2dd4bf}
main{max-width:860px;margin:18px auto 48px;padding:0 12px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:34px 38px 40px;box-shadow:0 6px 24px rgba(16,42,84,.10)}
.fields{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px 18px;font-size:15px;color:var(--muted);margin-bottom:22px}
.fields span{border-bottom:1px solid var(--ink);padding-bottom:2px;min-height:24px}
.fields .w{grid-column:1/-1}
h1{font:700 29px/1.2 Georgia,"Times New Roman",serif;margin:0 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--muted);font-size:15px;margin-bottom:6px}
.meta b{color:var(--ink)}
.scope{margin:10px 0 24px;padding:10px 14px;border-left:4px solid var(--blue);background:#f1f5fd;font-size:15.5px}
h2{font:700 20px Georgia,serif;margin:30px 0 12px;color:var(--blue-d);display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px}
h2 span{font:500 14.5px "Segoe UI",sans-serif;color:var(--muted);white-space:nowrap}
.task{margin:0 0 18px;display:grid;grid-template-columns:34px 1fr;column-gap:6px;break-inside:avoid}
.num{font-weight:700;color:var(--blue-d)}
.q{margin:0}
.opts{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:3px 22px}
.opts li{font-size:16px}
.opts b{display:inline-block;width:22px}
.ans{display:none;margin:8px 0 0;padding:8px 12px;border-radius:6px;background:var(--keybg);color:var(--key);font-size:15.5px;border:1px solid #b9e0db}
.ans b{color:#0b5b54}
body.key .ans{display:block}
.space{height:54px;border-bottom:1px dotted var(--line)}
body.key .space{display:none}
.foot{margin-top:28px;padding-top:12px;border-top:2px solid var(--ink);display:flex;justify-content:space-between;font-weight:600;gap:12px;flex-wrap:wrap}
.note{max-width:860px;margin:0 auto;padding:0 14px;color:var(--muted);font-size:14px}
@media (max-width:640px){.sheet{padding:22px 16px 28px}.fields{grid-template-columns:1fr}.opts{grid-template-columns:1fr}h1{font-size:24px}}
@media print{
 body{background:#fff;font-size:12.5pt}
 .bar,.note{display:none}
 main{margin:0;max-width:none;padding:0}
 .sheet{border:0;box-shadow:none;padding:0}
 .scope{background:none}
 .ans{break-inside:avoid}
}
</style>

var groupTitle={t:"Test topshiriqlari",s:"Qisqa javobli savollar",c:"Masalalar",h:"Murakkab masala"};
var nav=document.getElementById("nav"), sheet=document.getElementById("sheet");
D.forEach(function(a,i){
  var b=document.createElement("button");
  b.textContent=a.nav; b.dataset.id=a.id;
  if(i===5)b.className="sep";
  b.onclick=function(){location.hash=a.id};
  nav.appendChild(b);
});

function render(){
  var id=(location.hash||"#bsb1").slice(1);
  var a=D.filter(function(x){return x.id===id})[0]||D[0];
  Array.prototype.forEach.call(nav.children,function(b){b.setAttribute("aria-current",b.dataset.id===a.id)});
  var total=0,n=0,html="";
  var order=["t","s","c","h"], roman={t:"I",s:"II",c:"III",h:"IV"};
  html+='<div class="fields"><span>Maktab: ____-sonli umumta’lim maktabi</span><span>Sinf: 8-___</span><span>Sana: ____________</span><span class="w">O‘quvchining F.I.Sh.: </span></div>';
  html+='<h1>'+a.title+'</h1>';
  html+='<div class="meta"><span>Fan: <b>Fizika, 8-sinf</b></span><span>Vaqt: <b>'+a.time+'</b></span><span>Jami: <b id="tot"></b></span></div>';
  html+='<div class="scope"><b>Qamrov:</b> '+a.scope+'.</div>';
  order.forEach(function(k){
    var items=a.tasks.filter(function(t){return t[0]===k});
    if(!items.length)return;
    var p=a.pt[k], sub=items.length*p; total+=sub;
    html+='<h2>'+roman[k]+'. '+groupTitle[k]+' <span>har biri '+p+' ball · '+sub+' ball</span></h2>';
    items.forEach(function(t){
      n++;
      html+='<div class="task"><div class="num">'+n+'.</div><div><p class="q">'+t[1]+'</p>';
      if(k==="t"){
        html+='<ul class="opts">'+t[2].map(function(o,j){return '<li><b>'+L[j]+')</b> '+o+'</li>'}).join("")+'</ul>';
        html+='<div class="ans"><b>Javob: '+L[t[3]]+') '+t[2][t[3]]+'</b></div>';
      }else{
        html+='<div class="space"></div><div class="ans"><b>Javob:</b> '+t[2]+'</div>';
      }
      html+='</div></div>';
    });
  });
  html+='<div class="foot"><span>Olingan ball: ______ / '+total+'</span><span>O‘qituvchi imzosi: ____________</span></div>';
  sheet.innerHTML=html;
  document.getElementById("tot").textContent=total+" ball";
  document.title=a.title+" · 8-sinf Fizika";
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);
render();

kb.onclick=function(){var on=document.body.classList.toggle("key");kb.setAttribute("aria-pressed",on);kb.textContent=on?"Javoblarni yashirish":"Javoblar kaliti"};
